<<: !include "bleproxy_via_uart_baseline.yaml"


light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO8
    num_leds: 1
    chipset: WS6812
    internal: true
    restore_mode: ALWAYS_OFF
    id: led_light

interval:
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: 'return id(ota_mode_switch).state;'
          then:
            - light.turn_on:
                id: led_light
                red: 100%
                green: 0%
                blue: 0%
                brightness: 100%
          else:
            - light.turn_on:
                id: led_light
                red: 0%
                green: 100%
                blue: 0%
                brightness: 100%

